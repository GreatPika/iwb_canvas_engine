name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tool-test-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.filter.outputs.tool_tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect tool-test-impacting changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tool_tests:
              - 'lib/iwb_canvas_engine.dart'
              - 'tool/**'
              - 'test/tool/**'
              - 'test/tool/support/guardrail_fixture_manifest.dart'
              - 'test/tool/support/guardrail_fixture_writer.dart'
              - 'test/tool/support/guardrails_sandbox_support.dart'
              - 'test/tool/support/import_boundaries_sandbox_support.dart'
              - 'test/tool/support/tool_diagnostic_matchers.dart'
              - 'test/tool/support/tool_process_test_support.dart'
              - 'test/tool/support/public_entrypoint_contract.dart'
              - 'pubspec.yaml'
              - 'pubspec.lock'

  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.9"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Format (check)
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test tool

      - name: Analyze
        run: flutter analyze

      - name: Example pub get
        working-directory: example
        run: flutter pub get

      - name: Example analyze
        working-directory: example
        run: flutter analyze lib test

      - name: Example test
        working-directory: example
        run: flutter test --no-pub test

      - name: Verification contract
        run: dart run tool/check_verification_contract.dart

      - name: Import boundaries
        run: dart run tool/check_import_boundaries.dart

      - name: Invariant coverage
        run: dart run tool/check_invariant_coverage.dart

      - name: Guardrails
        run: dart run tool/check_guardrails.dart

      - name: Public API surface
        run: dart run tool/check_public_api_surface.dart

  tests-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.9"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Resolve test concurrency
        id: test-jobs
        run: |
          JOBS="$(getconf _NPROCESSORS_ONLN)"
          if [ "$JOBS" -gt 1 ]; then
            JOBS=$((JOBS - 1))
          fi
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"

      - name: Test
        run: flutter test --coverage --no-pub --exclude-tags=tool -j "${{ steps.test-jobs.outputs.jobs }}"

      - name: Coverage (100%)
        run: dart run tool/check_coverage.dart

  tool-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tool-test-changes
    if: needs.tool-test-changes.outputs.should_run == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.9"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Resolve test concurrency
        id: test-jobs
        run: |
          JOBS="$(getconf _NPROCESSORS_ONLN)"
          if [ "$JOBS" -gt 1 ]; then
            JOBS=$((JOBS - 1))
          fi
          if [ "$JOBS" -gt 6 ]; then
            JOBS=6
          fi
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"

      - name: Tool tests
        run: dart run tool/run_tool_tests.dart --jobs="${{ steps.test-jobs.outputs.jobs }}"

  release-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.9"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Dartdoc
        run: dart doc

      - name: Publish dry-run
        run: dart pub publish --dry-run
