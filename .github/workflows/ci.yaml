name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.9"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Format (check)
        run: dart format --output=none --set-exit-if-changed lib test example/lib tool

      - name: Analyze
        run: flutter analyze

      - name: Import boundaries
        run: dart run tool/check_import_boundaries.dart

      - name: Invariant coverage
        run: dart run tool/check_invariant_coverage.dart

      - name: Guardrails
        run: dart run tool/check_guardrails.dart

      - name: Public API surface
        run: dart run tool/check_public_api_surface.dart

  tests-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.9"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Resolve test concurrency
        id: test-jobs
        run: |
          JOBS="$(getconf _NPROCESSORS_ONLN)"
          if [ "$JOBS" -gt 1 ]; then
            JOBS=$((JOBS - 1))
          fi
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"

      - name: Test
        run: flutter test --coverage --no-pub -j "${{ steps.test-jobs.outputs.jobs }}"

      - name: Coverage (100%)
        run: dart run tool/check_coverage.dart

  smoke-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.9"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Load profiles (smoke)
        run: dart run tool/bench/run_load_profiles.dart --profile=smoke --output=build/bench/load_profiles_smoke.json

      - name: Upload smoke benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-profiles-smoke
          path: build/bench/load_profiles_smoke.json

      - name: Diff smoke benchmark report vs baseline (Phase A, non-blocking)
        if: always()
        run: |
          BASELINE=tool/bench/baselines/load_profiles_smoke_baseline.json
          CURRENT=build/bench/load_profiles_smoke.json
          OUTPUT=build/bench/load_profiles_smoke_diff.json
          if [ -f "$BASELINE" ] && [ -f "$CURRENT" ]; then
            dart run tool/bench/diff_load_profiles.dart \
              --profile=smoke \
              --baseline="$BASELINE" \
              --current="$CURRENT" \
              --output="$OUTPUT" || true
          else
            mkdir -p build/bench
            cat > "$OUTPUT" <<'JSON'
          {
            "profile": "smoke",
            "status": "skipped",
            "reason": "baseline_or_current_report_missing"
          }
          JSON
          fi

      - name: Upload smoke benchmark diff artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-profiles-smoke-diff
          path: build/bench/load_profiles_smoke_diff.json

  release-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.9"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Dartdoc
        run: dart doc

      - name: Publish dry-run
        run: dart pub publish --dry-run
