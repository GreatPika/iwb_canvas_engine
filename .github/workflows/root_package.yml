name: Root package

on:
  pull_request:
  push:
    branches:
      - main
      - new-architecture

jobs:
  root-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.0"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format -o none --set-exit-if-changed .

      - name: Check generated docs
        run: dart run docs/tool/sync_generated_docs.dart --check

      - name: Check docs
        run: dart run docs/tool/check_docs.dart

      - name: Check current architecture graph
        run: dart run tool/architecture_graph/check.dart

      - name: Check generated graph views
        run: dart run tool/architecture_graph/generate_views.dart --check

      - name: Test all Flutter tests
        run: flutter test --concurrency=1 $(find test -name '*_test.dart' -print)

      - name: Run vector preparation VM retaining-path evidence
        run: flutter test --enable-vmservice --concurrency=1 test/api/vector_preparation_retention_test.dart test/api/vector_preparation_context_test.dart

      - name: Analyze Dart
        run: dart analyze

      - name: Run guardrails
        run: dart run tool/guardrails/run.dart

  example-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.0"
          channel: stable

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Test example package
        working-directory: example
        run: flutter test

      - name: Analyze example package
        working-directory: example
        run: flutter analyze
