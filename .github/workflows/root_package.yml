name: Root package

on:
  pull_request:
  push:
    branches:
      - main
      - new-architecture

jobs:
  root-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check generated docs
        run: dart run docs/tool/sync_generated_docs.dart --check

      - name: Check docs
        run: dart run docs/tool/check_docs.dart

      - name: Check current architecture graph
        run: dart run tool/architecture_graph/check.dart

      - name: Check generated graph views
        run: dart run tool/architecture_graph/generate_views.dart --check

      - name: Test all benchmark tests
        run: dart test $(find test/benchmarks -maxdepth 1 -name '*_test.dart' -print | sort)

      - name: Test all non-benchmark Flutter tests
        env:
          EXAMPLE_BOUNDARY_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          EXAMPLE_BOUNDARY_DIFF_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: flutter test --concurrency=1 $(find test -path test/benchmarks -prune -o -name '*_test.dart' -print)

      - name: Analyze Dart
        run: dart analyze

      - name: Run guardrails
        run: dart run tool/guardrails/run.dart

  example-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Test example package
        working-directory: example
        run: flutter test

      - name: Analyze example package
        working-directory: example
        run: flutter analyze
