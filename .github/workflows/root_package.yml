name: Root package

on:
  pull_request:
  push:
    branches:
      - main
      - new-architecture

jobs:
  root-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: dart analyze

      - name: Run guardrails
        run: dart run tool/guardrails/run.dart
