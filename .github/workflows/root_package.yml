name: Root package

on:
  pull_request:
  push:
    branches:
      - main
      - new-architecture

jobs:
  root-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check generated docs
        run: dart run docs/tool/sync_generated_docs.dart --check

      - name: Check docs
        run: dart run docs/tool/check_docs.dart

      - name: Test benchmark manifest
        run: dart test test/benchmarks/benchmark_manifest_test.dart

      - name: Test benchmark required cases
        run: dart test test/benchmarks/required_cases_test.dart

      - name: Test benchmark diff fixtures
        run: dart test test/benchmarks/benchmark_diff_test.dart

      - name: Analyze Dart
        run: dart analyze

      - name: Run guardrails
        run: dart run tool/guardrails/run.dart
