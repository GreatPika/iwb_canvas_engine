name: Update benchmark baseline

on:
  workflow_dispatch:

jobs:
  update-benchmark-baseline:
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_PATH: build/bench/candidates/release_ubuntu_24_04_flutter_3_38_0/${{ github.run_id }}.json
      APPROVED_PATH: tool/bench/baselines/approved/release_ubuntu_24_04_flutter_3_38_0.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.0

      - name: Install dependencies
        run: flutter pub get

      - name: Run release benchmark candidate
        run: dart run tool/bench/run.dart --profile=release --output=${CANDIDATE_PATH}

      - name: Accept baseline candidate
        run: dart run tool/bench/update_baseline.dart --profile=release --candidate=${CANDIDATE_PATH} --approved=${APPROVED_PATH}

      - name: Upload accepted baseline
        uses: actions/upload-artifact@v4
        with:
          name: accepted-release-benchmark-baseline
          path: ${{ env.APPROVED_PATH }}
