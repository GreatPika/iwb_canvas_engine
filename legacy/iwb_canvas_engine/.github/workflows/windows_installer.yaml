name: Windows Installer

on:
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.9"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Example pub get
        working-directory: example
        run: flutter pub get

      - name: Build Windows release
        working-directory: example
        run: flutter build windows --release

      - name: Resolve installer metadata
        id: metadata
        shell: pwsh
        run: ./tool/windows/resolve_installer_metadata.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: './tool/windows/build_example_installer.ps1 -InstallerVersion "${{ steps.metadata.outputs.installer_version }}" -OutputDir "${{ steps.metadata.outputs.output_dir }}" -SafeVersion "${{ steps.metadata.outputs.safe_version }}"'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.metadata.outputs.safe_version }}
          path: ${{ steps.metadata.outputs.output_dir }}/*.exe
          if-no-files-found: error
