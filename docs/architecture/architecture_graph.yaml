schemaVersion: 1
phases:
  - id: P0
    title: Package skeleton and hard boundaries
    status: closed
    sourceDocs:
      - path: docs/implementation/p0_package_skeleton_and_hard_boundaries.md
  - id: P1
    title: V1 scope gate before public API freeze
    status: closed
    sourceDocs:
      - path: docs/implementation/p1_v1_scope_gate_before_public_api_freeze.md
  - id: P2
    title: Public API v1 freeze
    status: closed
    sourceDocs:
      - path: docs/implementation/p2_public_api_v1_freeze.md
  - id: P3
    title: Schema v1 DTO validation and codec skeleton
    status: closed
    sourceDocs:
      - path: docs/implementation/p3_schema_v1_dto_validation_and_codec_skeleton.md
      - path: docs/contracts/codec_boundary.md
  - id: P4
    title: Runtime spine, store, and projection cache
    status: closed
    sourceDocs:
      - path: docs/implementation/p4_runtime_spine.md
      - path: docs/architecture/01_runtime_ownership.md
  - id: P5
    title: Edit core
    status: closed
    sourceDocs:
      - path: docs/implementation/p5_edit_core.md
      - path: docs/contracts/edit_kernel.md
  - id: P6
    title: Load document
    status: closed
    sourceDocs:
      - path: docs/implementation/p6_load_document.md
      - path: docs/contracts/load_document.md
  - id: P7
    title: Resources and images
    status: closed
    sourceDocs:
      - path: docs/implementation/p7_resources_and_images.md
      - path: docs/contracts/resources.md
  - id: P8
    title: Geometry and spatial
    status: closed
    sourceDocs:
      - path: docs/implementation/p8_geometry_and_spatial.md
      - path: docs/contracts/spatial_kernel.md
  - id: P9
    title: Frame rendering and caches
    status: closed
    sourceDocs:
      - path: docs/implementation/p9_frame_rendering_and_caches.md
      - path: docs/contracts/frame_rendering.md
      - path: docs/contracts/cache_policy.md
  - id: P10
    title: Selection and move
    status: future
    sourceDocs:
      - path: docs/implementation/p10_selection_and_move.md
      - path: docs/contracts/interaction_engine.md
  - id: P11
    title: Draw tools
    status: future
    sourceDocs:
      - path: docs/implementation/p11_draw_tools.md
      - path: docs/contracts/operation_matrix.md
  - id: P12
    title: Eraser and text request
    status: future
    sourceDocs:
      - path: docs/implementation/p12_eraser_and_text_request.md
      - path: docs/contracts/interaction_engine.md
  - id: P13
    title: Flutter surface
    status: future
    sourceDocs:
      - path: docs/implementation/p13_flutter_surface.md
      - path: docs/architecture/02_package_boundaries.md
  - id: P14
    title: Benchmarks, diagrams, and release readiness
    status: measurement
    sourceDocs:
      - path: docs/implementation/p14_benchmarks_diagrams_and_release_readiness.md
      - path: docs/verification/benchmarks.md
coverage:
  publicSurfaces:
    - lib/iwb_canvas_engine.dart
    - lib/src/api/**
  architectureOwners:
    - lib/src/contracts/public/**
    - lib/src/contracts/internal/**
    - lib/src/runtime/**
    - lib/src/codec/**
    - lib/src/diagnostics/**
    - lib/src/store/**
    - lib/src/selection/**
    - lib/src/edit/**
    - lib/src/edit/staged_document_load.dart
    - lib/src/resources/**
    - lib/src/geometry/**
    - lib/src/frame/**
    - lib/src/interaction/**
    - lib/src/tools/**
    - lib/src/surface/**
  sensitiveThrows:
    - owner: codec.schema_v1
      under: lib/src/codec/**
      exception: CanvasDataException
  placeholders:
    - under: lib/src/api/**
  ignored:
    - "**/*_helper.dart"
    - "**/fixtures/**"
nodes:
  - id: api.public_surface
    label: Public package surface
    kind: public_surface
    owner: api
    phaseIntroduced: P0
    phaseRequiredBy: P0
    status: required
    coverageScope: publicSurfaces
    sourceDocs:
      - path: docs/implementation/p0_package_skeleton_and_hard_boundaries.md
      - path: docs/contracts/public_api_v1.md
    evidence:
      - Public consumers enter through the package export and API declarations.
    actual:
      declarations:
        - CanvasRuntime
      exports:
        - lib/src/api/canvas_runtime.dart
  - id: api.canvas_runtime
    label: Canvas runtime facade
    kind: facade
    owner: api
    phaseIntroduced: P2
    phaseRequiredBy: P4
    status: required
    coverageScope: publicSurfaces
    sourceDocs:
      - path: docs/implementation/p2_public_api_v1_freeze.md
      - path: docs/implementation/p4_runtime_spine.md
    evidence:
      - CanvasRuntime is the public facade for runtime state and ports.
    actual:
      declarations:
        - CanvasRuntime
  - id: api.camera_port
    label: Public camera port
    kind: public_port
    owner: contracts_public
    phaseIntroduced: P2
    phaseRequiredBy: P4
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/implementation/p2_public_api_v1_freeze.md
      - path: docs/architecture/01_runtime_ownership.md
    evidence:
      - The public camera port declaration is contract-owned, not proof of runtime camera ownership.
    actual:
      declarations:
        - CanvasCameraPort
  - id: contracts.public
    label: Public contract declarations
    kind: contract_owner
    owner: contracts_public
    phaseIntroduced: P6
    phaseRequiredBy: P6
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/architecture/02_package_boundaries.md
      - path: docs/contracts/public_api_v1.md
    evidence:
      - Public DTOs, values, errors, policies, runtime state/config types, and public port interfaces live below the API facade in contracts/public.
    actual:
      declarations:
        - CanvasDocument
        - CanvasRuntimeState
        - CanvasResourcePort
        - CanvasResourceResolver
        - CanvasDataException
  - id: contracts.internal_ports
    label: Internal owner ports and fact contracts
    kind: contract_owner
    owner: contracts_internal
    phaseIntroduced: P6
    phaseRequiredBy: P6
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/architecture/02_package_boundaries.md
      - path: docs/contracts/edit_kernel.md
      - path: docs/contracts/load_document.md
      - path: docs/contracts/resources.md
    evidence:
      - Internal ports, immutable facts, delivery effects, the resource catalog seam, resource dirty outcomes, and resolver mutation guards are declaration-only contracts shared by implementation owners.
    actual:
      declarations:
        - CommitDeliveryResult
        - FrameFactsPort
        - ResourceCatalogPort
        - ResourceDirtyOutcome
        - ResolverMutationGuard
  - id: diagnostics.hub
    label: Diagnostics hub
    kind: diagnostics_owner
    owner: diagnostics
    phaseIntroduced: P3
    phaseRequiredBy: P3
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/contracts/diagnostics.md
      - path: docs/implementation/p3_schema_v1_dto_validation_and_codec_skeleton.md
    evidence:
      - DiagnosticsHub owns runtime diagnostic recording and sanitized projection.
    actual:
      declarations:
        - DiagnosticsHub
  - id: codec.schema_v1
    label: Schema v1 codec
    kind: codec_owner
    owner: codec
    phaseIntroduced: P3
    phaseRequiredBy: P3
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/contracts/schema_v1.md
      - path: docs/contracts/codec_boundary.md
      - path: docs/implementation/p3_schema_v1_dto_validation_and_codec_skeleton.md
    evidence:
      - Schema v1 decode and encode own JSON boundary validation.
    actual:
      declarations:
        - decodeSchemaV1Document
        - decodeSchemaV1DocumentFromJson
        - encodeSchemaV1Document
        - recordSchemaV1FailureDiagnostic
  - id: runtime.root
    label: Runtime composition root
    kind: runtime_owner
    owner: runtime
    phaseIntroduced: P4
    phaseRequiredBy: P4
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/implementation/p4_runtime_spine.md
      - path: docs/architecture/01_runtime_ownership.md
    evidence:
      - RuntimeRoot composes store, selection, config, facts, and public state.
    actual:
      declarations:
        - RuntimeRoot
      implementedInterfaces:
        - DocumentFactsPort
        - FrameFactsPort
  - id: runtime.view_camera
    label: Runtime-owned view camera
    kind: runtime_state_owner
    owner: runtime
    phaseIntroduced: P4
    phaseRequiredBy: P4
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/architecture/01_runtime_ownership.md
      - path: docs/implementation/p4_runtime_spine.md
    evidence:
      - View camera ownership must live in runtime state, not as a facade placeholder.
    actual:
      declarations:
        - RuntimeRoot
  - id: store.document_kernel
    label: Document store kernel
    kind: store_owner
    owner: store
    phaseIntroduced: P4
    phaseRequiredBy: P4
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/implementation/p4_runtime_spine.md
      - path: docs/contracts/cache_policy.md
    evidence:
      - DocumentStoreKernel owns committed document facts and projection cache input.
    actual:
      declarations:
        - DocumentStoreKernel
  - id: selection.kernel
    label: Selection kernel
    kind: selection_owner
    owner: selection
    phaseIntroduced: P4
    phaseRequiredBy: P4
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/implementation/p4_runtime_spine.md
      - path: docs/implementation/p10_selection_and_move.md
    evidence:
      - Selection state is owned behind runtime read ports.
    actual:
      declarations:
        - SelectionKernel
  - id: edit.kernel
    label: Edit kernel
    kind: edit_owner
    owner: edit
    phaseIntroduced: P5
    phaseRequiredBy: P5
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/implementation/p5_edit_core.md
      - path: docs/contracts/edit_kernel.md
    evidence:
      - Edit mutation semantics become required in P5.
    actual:
      declarations:
        - EditKernel
  - id: load_document.pipeline
    label: Load document pipeline
    kind: load_owner
    owner: load_document
    phaseIntroduced: P6
    phaseRequiredBy: P6
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/implementation/p6_load_document.md
      - path: docs/contracts/load_document.md
    evidence:
      - Loading validated documents is implemented as a staged runtime pipeline.
    actual:
      declarations:
        - LoadDocumentPipeline
  - id: resource.kernel
    label: Resource kernel
    kind: resource_owner
    owner: resource
    phaseIntroduced: P7
    phaseRequiredBy: P7
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/implementation/p7_resources_and_images.md
      - path: docs/contracts/resources.md
    evidence:
      - ResourceKernel owns the implemented non-surface resource API, committed catalog reads through ResourceCatalogPort, resourceVisualRevision, dirty-resource no-op and acceptance decisions, and dirty outcomes; resolver/cache/session behavior is owned by SurfaceResourceSession and runtime handoff seams, not by ResourceKernel.
    actual:
      declarations:
        - ResourceKernel
  - id: resource.surface_session
    label: Surface resource session
    kind: resource_owner
    owner: resource
    phaseIntroduced: P7
    phaseRequiredBy: P7
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/implementation/p7_resources_and_images.md
      - path: docs/contracts/resources.md
    evidence:
      - SurfaceResourceSession owns the surface-scoped resolver reference, resolverGeneration, ImageResolveCache, per-frame resolver budget, same-frame null-result suppression, and bounded placeholder policy for missing descriptors and absent resolvers.
    actual:
      declarations:
        - SurfaceResourceSession
  - id: geometry.spatial_index
    label: Geometry and spatial index
    kind: spatial_owner
    owner: spatial
    phaseIntroduced: P8
    phaseRequiredBy: P8
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/implementation/p8_geometry_and_spatial.md
      - path: docs/contracts/spatial_kernel.md
    evidence:
      - SpatialKernel owns derived spatial state, tile/outlier membership, typed budget results, and stale candidate rejection without becoming committed scene truth.
    actual:
      declarations:
        - SpatialKernel
        - TileIndex
        - OutlierIndex
  - id: frame.renderer
    label: Frame renderer and cache owner
    kind: frame_owner
    owner: frame
    phaseIntroduced: P9
    phaseRequiredBy: P9
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/implementation/p9_frame_rendering_and_caches.md
      - path: docs/contracts/frame_rendering.md
    evidence:
      - FrameEngine owns frame capture, ordinary paint planning, selected supplement staging, background/overlay planning, immutable painter output, repaint signals, and bounded frame cache orchestration.
    actual:
      declarations:
        - FrameEngine
        - FrameCaptureService
        - OrdinaryPaintPlanner
        - SelectedMoveSupplementPlanner
        - SelectionDecorationPlanner
        - PaintAssetBindingService
        - StaticBackgroundPlanner
        - OverlayPreviewPlanner
  - id: interaction.engine
    label: Interaction engine boundary
    kind: interaction_owner
    owner: interaction
    phaseIntroduced: P10
    phaseRequiredBy: P10
    status: future
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/implementation/p10_selection_and_move.md
      - path: docs/contracts/interaction_engine.md
    evidence:
      - InteractionEngine is the future boundary for pointer sessions, tool preview intents, selection/move behavior, and terminal commit coordination.
    actual:
      declarations:
        - InteractionEngine
        - InteractionReadPort
        - PointerSession
        - PointerSampleNormalizer
        - PointerToolCleanupCoordinator
  - id: draw.tools
    label: Draw tool owner
    kind: tool_owner
    owner: tools
    phaseIntroduced: P11
    phaseRequiredBy: P11
    status: future
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/implementation/p11_draw_tools.md
      - path: docs/contracts/operation_matrix.md
    evidence:
      - Drawing tools become required in P11.
    actual:
      declarations:
        - DrawToolController
  - id: eraser_text.request
    label: Eraser and text request owner
    kind: interaction_owner
    owner: interaction
    phaseIntroduced: P12
    phaseRequiredBy: P12
    status: future
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/implementation/p12_eraser_and_text_request.md
      - path: docs/contracts/interaction_engine.md
    evidence:
      - Eraser and text request flows are future-phase interaction scope.
    actual:
      declarations:
        - EraserTextRequestCoordinator
  - id: flutter.surface
    label: Flutter surface integration
    kind: surface_owner
    owner: surface
    phaseIntroduced: P13
    phaseRequiredBy: P13
    status: future
    coverageScope: publicSurfaces
    sourceDocs:
      - path: docs/implementation/p13_flutter_surface.md
      - path: docs/architecture/02_package_boundaries.md
    evidence:
      - Flutter widget integration remains future-phase public surface scope.
    actual:
      declarations:
        - CanvasSurface
  - id: release.measurement
    label: Measurement and release alignment
    kind: measurement_scope
    owner: release
    phaseIntroduced: P14
    phaseRequiredBy: P14
    status: measurement
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/implementation/p14_benchmarks_diagrams_and_release_readiness.md
      - path: docs/verification/benchmarks.md
    isolationAllowances:
      - views:
          - release_verification
        sourceDocs:
          - path: docs/implementation/p14_benchmarks_diagrams_and_release_readiness.md
          - path: docs/verification/benchmarks.md
        reason: P14 is release measurement and alignment scope, not a runtime production owner with architecture dependencies.
    evidence:
      - P14 is release measurement scope, not a normal production owner.
    actual:
      declarations:
        - ReleaseReadiness
edges:
  - id: api.public_surface.exports_runtime
    from: api.public_surface
    to: api.canvas_runtime
    kind: exports
    phaseRequiredBy: P2
    status: required
    sourceDocs:
      - path: docs/contracts/public_api_v1.md
    evidence:
      - The package public surface exports the runtime facade.
    actual:
      exports:
        - lib/src/api/canvas_runtime.dart
  - id: api.public_surface.wrapper_exports_contracts
    from: api.public_surface
    to: contracts.public
    kind: wrapper_export
    phaseRequiredBy: P6
    status: required
    sourceDocs:
      - path: docs/architecture/02_package_boundaries.md
      - path: docs/contracts/public_api_v1.md
    evidence:
      - API declaration files are compatibility wrappers that re-export public contract declarations.
    actual:
      exports:
        - lib/src/contracts/public/canvas_document.dart
  - id: contracts.internal_ports.uses_public_contracts
    from: contracts.internal_ports
    to: contracts.public
    kind: contract_dependency
    phaseRequiredBy: P6
    status: required
    sourceDocs:
      - path: docs/architecture/02_package_boundaries.md
      - path: docs/contracts/edit_kernel.md
      - path: docs/contracts/resources.md
    evidence:
      - Internal owner facts and delivery seams may depend on public contract IDs and immutable DTO facts while staying independent from implementation owners.
    actual:
      imports:
        - lib/src/contracts/public/canvas_ids.dart
  - id: api.canvas_runtime.composes_runtime_root
    from: api.canvas_runtime
    to: runtime.root
    kind: composes
    phaseRequiredBy: P4
    status: required
    sourceDocs:
      - path: docs/implementation/p4_runtime_spine.md
    evidence:
      - CanvasRuntime delegates implemented runtime behavior to RuntimeRoot.
    actual:
      imports:
        - lib/src/runtime/runtime_root.dart
      compositionFields:
        - RuntimeRoot
  - id: runtime.root.owns_store
    from: runtime.root
    to: store.document_kernel
    kind: composes
    phaseRequiredBy: P4
    status: required
    sourceDocs:
      - path: docs/implementation/p4_runtime_spine.md
    evidence:
      - RuntimeRoot composes DocumentStoreKernel as the committed document owner.
    actual:
      compositionFields:
        - DocumentStoreKernel
  - id: runtime.root.owns_selection
    from: runtime.root
    to: selection.kernel
    kind: composes
    phaseRequiredBy: P4
    status: required
    sourceDocs:
      - path: docs/implementation/p4_runtime_spine.md
    evidence:
      - RuntimeRoot composes SelectionKernel behind the public selection port.
    actual:
      compositionFields:
        - SelectionKernel
  - id: runtime.root.composes_spatial_kernel
    from: runtime.root
    to: geometry.spatial_index
    kind: composes
    phaseRequiredBy: P8
    status: required
    sourceDocs:
      - path: docs/implementation/p8_geometry_and_spatial.md
      - path: docs/contracts/spatial_kernel.md
      - path: docs/architecture/01_runtime_ownership.md
    evidence:
      - RuntimeRoot composes SpatialKernel and applies spatial delivery before public runtime-state publication or commit-effect observer callbacks.
    actual:
      imports:
        - lib/src/geometry/spatial_kernel.dart
      compositionFields:
        - SpatialKernel
  - id: runtime.root.exposes_frame_facts
    from: runtime.root
    to: frame.renderer
    kind: frame_facts_provider
    phaseRequiredBy: P9
    status: required
    sourceDocs:
      - path: docs/contracts/frame_rendering.md
      - path: docs/implementation/p9_frame_rendering_and_caches.md
    evidence:
      - RuntimeRoot implements FrameFactsPort so FrameEngine and frame collaborators consume committed frame facts through the internal facts boundary instead of store internals.
    actual:
      implementedInterfaces:
        - FrameFactsPort
  - id: api.canvas_runtime.exposes_camera
    from: api.canvas_runtime
    to: api.camera_port
    kind: facade_port
    phaseRequiredBy: P4
    status: required
    sourceDocs:
      - path: docs/architecture/01_runtime_ownership.md
      - path: docs/implementation/p4_runtime_spine.md
    evidence:
      - The camera public port is visible on the facade.
    actual:
      delegationTargets:
        - RuntimeRoot
      delegationMembers:
        - CanvasRuntime.camera
  - id: api.canvas_runtime.camera.routes_to_runtime_view_camera
    from: api.canvas_runtime
    to: runtime.view_camera
    kind: facade_port
    phaseRequiredBy: P4
    status: required
    sourceDocs:
      - path: docs/architecture/01_runtime_ownership.md
      - path: docs/implementation/p4_runtime_spine.md
    evidence:
      - The public camera port must route to runtime-owned view camera state.
    actual:
      delegationTargets:
        - RuntimeRoot
      delegationMembers:
        - CanvasRuntime.camera
  - id: codec.schema_v1.uses_public_contracts
    from: codec.schema_v1
    to: contracts.public
    kind: data_boundary
    phaseRequiredBy: P3
    status: required
    sourceDocs:
      - path: docs/contracts/schema_v1.md
      - path: docs/contracts/codec_boundary.md
    evidence:
      - Schema v1 codec reads and writes public contract DTOs without runtime side effects.
    actual:
      imports:
        - lib/src/contracts/public/canvas_document.dart
  - id: codec.schema_v1.failures.report_to_diagnostics
    from: codec.schema_v1
    to: diagnostics.hub
    kind: diagnostic_route
    phaseRequiredBy: P3
    status: required
    sourceDocs:
      - path: docs/contracts/diagnostics.md
      - path: docs/implementation/p3_schema_v1_dto_validation_and_codec_skeleton.md
    evidence:
      - Codec failure paths must route through an explicit graph-checkable diagnostics bridge, not only import DiagnosticsHub.
    actual:
      delegationMembers:
        - recordSchemaV1FailureDiagnostic
      delegationTargets:
        - DiagnosticsHub
      sensitiveThrowOwner: codec.schema_v1
      sensitiveThrowRoutes:
        - recordSchemaV1FailureDiagnostic
  - id: interaction.engine.reliability_events.report_to_diagnostics
    from: interaction.engine
    to: diagnostics.hub
    kind: diagnostic_route
    phaseRequiredBy: P10
    status: future
    sourceDocs:
      - path: docs/contracts/diagnostics.md
      - path: docs/contracts/interaction_engine.md
      - path: docs/implementation/p10_selection_and_move.md
    evidence:
      - Interaction-observed hit-test fallback, query budget, and stale candidate reliability events are planned internal diagnostics with source interaction.
  - id: geometry.spatial_index.corrupted_rows.report_to_diagnostics
    from: geometry.spatial_index
    to: diagnostics.hub
    kind: diagnostic_route
    phaseRequiredBy: P14
    status: future
    sourceDocs:
      - path: docs/contracts/diagnostics.md
      - path: docs/contracts/geometry.md
      - path: docs/implementation/p8_geometry_and_spatial.md
    evidence:
      - Corrupted committed geometry or spatial rows return miss without mutation in P8 and remain outside P10 closure; policy-gated internal diagnostics are deferred until a later diagnostics integration phase adds an explicit bridge.
  - id: runtime.root.observer_failures.report_to_diagnostics
    from: runtime.root
    to: diagnostics.hub
    kind: diagnostic_route
    phaseRequiredBy: P14
    status: future
    sourceDocs:
      - path: docs/contracts/diagnostics.md
      - path: docs/contracts/edit_kernel.md
      - path: docs/implementation/p14_benchmarks_diagrams_and_release_readiness.md
    evidence:
      - Commit, load, and resource-dirty observer delivery failures are planned post-acceptance diagnostics owned by RuntimeRoot and must not roll back accepted results.
  - id: edit.kernel.mutates_store
    from: edit.kernel
    to: store.document_kernel
    kind: mutation_boundary
    phaseRequiredBy: P5
    status: required
    sourceDocs:
      - path: docs/contracts/edit_kernel.md
    evidence:
      - Edit behavior commits through the runtime-composed CommitInstaller seam into the committed store owner and returns a post-install apply result.
    actual:
      delegationMembers:
        - EditKernel._installCommittedDocument
      delegationTargets:
        - CommitInstaller
  - id: load_document.pipeline.replaces_store_document
    from: load_document.pipeline
    to: store.document_kernel
    kind: mutation_boundary
    phaseRequiredBy: P6
    status: required
    sourceDocs:
      - path: docs/contracts/load_document.md
    evidence:
      - Load document admits validated replacement documents into runtime state through the pipeline-owned store boundary.
    actual:
      compositionFields:
        - DocumentStoreKernel
  - id: runtime.root.owns_resource_kernel
    from: runtime.root
    to: resource.kernel
    kind: composition
    phaseRequiredBy: P7
    status: required
    sourceDocs:
      - path: docs/architecture/01_runtime_ownership.md
      - path: docs/contracts/resources.md
      - path: docs/implementation/p7_resources_and_images.md
    evidence:
      - RuntimeRoot composes and coordinates ResourceKernel for the public resource port, resource visual state publication, dirty-resource orchestration, and session invalidation events.
    actual:
      compositionFields:
        - ResourceKernel
  - id: runtime.root.invalidates_active_resource_session
    from: runtime.root
