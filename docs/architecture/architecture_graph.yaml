schemaVersion: 1
coverage:
  publicSurfaces:
    - lib/iwb_canvas_engine.dart
    - lib/src/api/**
  architectureOwners:
    - lib/src/contracts/public/**
    - lib/src/contracts/internal/**
    - lib/src/runtime/**
    - lib/src/codec/**
    - lib/src/diagnostics/**
    - lib/src/store/**
    - lib/src/selection/**
    - lib/src/edit/**
    - lib/src/edit/staged_document_load.dart
    - lib/src/resources/**
    - lib/src/geometry/**
    - lib/src/frame/**
    - lib/src/interaction/**
    - lib/src/tools/**
    - lib/src/surface/**
    - tool/bench/src/release_readiness.dart
  sensitiveThrows:
    - owner: codec.schema_v1
      under: lib/src/codec/**
      exception: CanvasDataException
  placeholders:
    - under: lib/src/api/**
  ignored:
    - "**/*_helper.dart"
    - "**/fixtures/**"
nodes:
  - id: api.public_surface
    label: Public package surface
    kind: public_surface
    owner: api
    status: required
    coverageScope: publicSurfaces
    sourceDocs:
      - path: docs/contracts/public_api_v1.md
    evidence:
      - Public consumers enter through the package export and API declarations.
    actual:
      declarations:
        - CanvasRuntime
      exports:
        - lib/src/api/canvas_runtime.dart
  - id: api.canvas_runtime
    label: Canvas runtime facade
    kind: facade
    owner: api
    status: required
    coverageScope: publicSurfaces
    sourceDocs:
      - path: docs/contracts/public_api_v1.md
      - path: docs/architecture/01_runtime_ownership.md
    evidence:
      - CanvasRuntime is the public facade for runtime state and ports.
    actual:
      declarations:
        - CanvasRuntime
  - id: api.camera_port
    label: Public camera port
    kind: public_port
    owner: contracts_public
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/architecture/01_runtime_ownership.md
    evidence:
      - The public camera port declaration is contract-owned, not proof of runtime camera ownership.
    actual:
      declarations:
        - CanvasCameraPort
  - id: contracts.public
    label: Public contract declarations
    kind: contract_owner
    owner: contracts_public
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/architecture/02_package_boundaries.md
      - path: docs/contracts/public_api_v1.md
    evidence:
      - Public DTOs, values, errors, policies, runtime state/config types, and public port interfaces live below the API facade in contracts/public.
    actual:
      declarations:
        - CanvasDocument
        - CanvasRuntimeState
        - CanvasResourcePort
        - CanvasResourceResolver
        - CanvasDataException
  - id: contracts.internal_ports
    label: Internal owner ports and fact contracts
    kind: contract_owner
    owner: contracts_internal
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/architecture/02_package_boundaries.md
      - path: docs/contracts/edit_kernel.md
      - path: docs/contracts/load_document.md
      - path: docs/contracts/resources.md
    evidence:
      - Internal ports, immutable facts, delivery effects, the resource catalog seam, resource dirty outcomes, and resolver mutation guards are declaration-only contracts shared by implementation owners.
    actual:
      declarations:
        - CommitDeliveryResult
        - FrameFactsPort
        - ResourceCatalogPort
        - ResourceDirtyOutcome
        - ResolverMutationGuard
  - id: diagnostics.hub
    label: Diagnostics hub
    kind: diagnostics_owner
    owner: diagnostics
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/contracts/diagnostics.md
    evidence:
      - DiagnosticsHub owns runtime diagnostic recording and sanitized projection.
    actual:
      declarations:
        - DiagnosticsHub
        - DiagnosticCode
        - DiagnosticDataCode
        - DiagnosticInteractionCode
        - InteractionDiagnosticCode
  - id: codec.schema_v1
    label: Schema v1 codec
    kind: codec_owner
    owner: codec
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/contracts/schema_v1.md
      - path: docs/contracts/codec_boundary.md
    evidence:
      - Schema v1 decode and encode own JSON boundary validation.
    actual:
      declarations:
        - decodeSchemaV1Document
        - decodeSchemaV1DocumentFromJson
        - encodeSchemaV1Document
        - recordSchemaV1FailureDiagnostic
  - id: runtime.root
    label: Runtime composition root
    kind: runtime_owner
    owner: runtime
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/architecture/01_runtime_ownership.md
    evidence:
      - RuntimeRoot composes store, selection, config, facts, public state, and the runtime-local interaction read adapter.
    actual:
      declarations:
        - RuntimeRoot
        - RuntimeInteractionReadAdapter
      implementedInterfaces:
        - DocumentFactsPort
        - FrameFactsPort
  - id: runtime.view_camera
    label: Runtime-owned view camera
    kind: runtime_state_owner
    owner: runtime
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/architecture/01_runtime_ownership.md
    evidence:
      - View camera ownership must live in runtime state, not as a facade placeholder.
    actual:
      declarations:
        - RuntimeRoot
  - id: store.document_kernel
    label: Document store kernel
    kind: store_owner
    owner: store
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/contracts/cache_policy.md
    evidence:
      - DocumentStoreKernel owns committed document facts and projection cache input.
    actual:
      declarations:
        - DocumentStoreKernel
  - id: selection.kernel
    label: Selection kernel
    kind: selection_owner
    owner: selection
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/architecture/01_runtime_ownership.md
    evidence:
      - Selection state is owned behind runtime read ports.
    actual:
      declarations:
        - SelectionKernel
  - id: edit.kernel
    label: Edit kernel
    kind: edit_owner
    owner: edit
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/contracts/edit_kernel.md
    evidence:
      - Edit mutation semantics become required in edit.
    actual:
      declarations:
        - EditKernel
  - id: load_document.pipeline
    label: Load document pipeline
    kind: load_owner
    owner: load_document
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/contracts/load_document.md
    evidence:
      - Loading validated documents is implemented as a staged runtime pipeline.
    actual:
      declarations:
        - LoadDocumentPipeline
  - id: resource.kernel
    label: Resource kernel
    kind: resource_owner
    owner: resource
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/contracts/resources.md
    evidence:
      - ResourceKernel owns the implemented non-surface resource API, committed catalog reads through ResourceCatalogPort, resourceVisualRevision, dirty-resource no-op and acceptance decisions, and dirty outcomes; resolver/cache/session behavior is owned by SurfaceResourceSession and runtime handoff seams, not by ResourceKernel.
    actual:
      declarations:
        - ResourceKernel
  - id: resource.surface_session
    label: Surface resource session
    kind: resource_owner
    owner: resource
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/contracts/resources.md
    evidence:
      - SurfaceResourceSession owns the surface-scoped resolver reference, resolverGeneration, ImageResolveCache, per-frame resolver budget, same-frame null-result suppression, and bounded placeholder policy for missing descriptors and absent resolvers.
    actual:
      declarations:
        - SurfaceResourceSession
  - id: geometry.spatial_index
    label: Geometry and spatial index
    kind: spatial_owner
    owner: spatial
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/contracts/spatial_kernel.md
    evidence:
      - SpatialKernel owns derived spatial state, tile/outlier membership, typed budget results, and stale candidate rejection without becoming committed scene truth.
    actual:
      declarations:
        - SpatialKernel
        - TileIndex
        - OutlierIndex
  - id: frame.renderer
    label: Frame renderer and cache owner
    kind: frame_owner
    owner: frame
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/contracts/frame_rendering.md
    evidence:
      - FrameEngine owns frame capture, ordinary paint planning, selected supplement staging, background/overlay planning, immutable painter output, repaint signals, and bounded frame cache orchestration.
    actual:
      declarations:
        - FrameEngine
        - FrameCaptureService
        - OrdinaryPaintPlanner
        - SelectedMoveSupplementPlanner
        - SelectionDecorationPlanner
        - PaintAssetBindingService
        - StaticBackgroundPlanner
        - OverlayPreviewPlanner
  - id: interaction.engine
    label: Interaction engine boundary
    kind: interaction_owner
    owner: interaction
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/contracts/interaction_engine.md
    evidence:
      - InteractionEngine is the current boundary for pointer sessions, tool preview intents, selection/move behavior, and terminal commit coordination.
    actual:
      declarations:
        - InteractionEngine
        - InteractionDiagnosticsSink
        - InteractionReadPort
        - PointerSession
        - PointerSampleNormalizer
        - PointerToolCleanupCoordinator
  - id: draw.tools
    label: Draw tool owner
    kind: interaction_owner
    owner: interaction
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/contracts/operation_matrix.md
    evidence:
      - DrawStrokeMachine and LineMachine own pencil, marker, and line lifecycle decisions while InteractionEngine owns active pointer, pending line, preview, and cleanup state.
    actual:
      declarations:
        - DrawStrokeMachine
        - LineMachine
  - id: eraser_context.request
    label: Eraser and context request owner
    kind: interaction_owner
    owner: interaction
    status: required
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/contracts/interaction_engine.md
    evidence:
      - EraserMachine, ContextActionRouter, and InteractionRequestRegistry own eraser/context-action eraser capture, context request routing, and request guard facts under the interaction boundary.
    actual:
      declarations:
        - EraserMachine
        - ContextActionRouter
        - InteractionRequestRegistry
  - id: flutter.surface
    label: Flutter surface integration
    kind: surface_owner
    owner: surface
    status: required
    coverageScope: publicSurfaces
    sourceDocs:
      - path: docs/architecture/02_package_boundaries.md
    evidence:
      - Flutter widget integration is current public surface scope.
    actual:
      declarations:
        - CanvasSurface
  - id: release.measurement
    label: Measurement and release alignment
    kind: measurement_scope
    owner: release
    status: measurement
    coverageScope: architectureOwners
    sourceDocs:
      - path: docs/verification/benchmarks.md
    isolationAllowances:
      - views:
          - release_verification
        sourceDocs:
          - path: docs/verification/benchmarks.md
        reason: Release measurement and alignment are release-verification scope, not runtime production ownership with architecture dependencies.
    evidence:
      - Release measurement is release-verification scope, not a normal production owner.
    actual:
      declarations:
        - ReleaseReadiness
edges:
  - id: api.public_surface.exports_runtime
    from: api.public_surface
    to: api.canvas_runtime
    kind: exports
    status: required
    sourceDocs:
      - path: docs/contracts/public_api_v1.md
    evidence:
      - The package public surface exports the runtime facade.
    actual:
      exports:
        - lib/src/api/canvas_runtime.dart
  - id: api.public_surface.wrapper_exports_contracts
    from: api.public_surface
    to: contracts.public
    kind: wrapper_export
    status: required
    sourceDocs:
      - path: docs/architecture/02_package_boundaries.md
      - path: docs/contracts/public_api_v1.md
    evidence:
      - API declaration files are public facade wrappers that re-export public contract declarations.
    actual:
      exports:
        - lib/src/contracts/public/canvas_document.dart
  - id: contracts.internal_ports.uses_public_contracts
    from: contracts.internal_ports
    to: contracts.public
    kind: contract_dependency
    status: required
    sourceDocs:
      - path: docs/architecture/02_package_boundaries.md
      - path: docs/contracts/edit_kernel.md
      - path: docs/contracts/resources.md
    evidence:
      - Internal owner facts and delivery seams may depend on public contract IDs and immutable DTO facts while staying independent from implementation owners.
    actual:
      imports:
        - lib/src/contracts/public/canvas_ids.dart
  - id: api.canvas_runtime.composes_runtime_root
    from: api.canvas_runtime
    to: runtime.root
    kind: composes
    status: required
    sourceDocs:
      - path: docs/architecture/01_runtime_ownership.md
    evidence:
      - CanvasRuntime delegates implemented runtime behavior to RuntimeRoot.
    actual:
      imports:
        - lib/src/runtime/runtime_root.dart
      compositionFields:
        - RuntimeRoot
  - id: runtime.root.owns_store
    from: runtime.root
    to: store.document_kernel
    kind: composes
    status: required
    sourceDocs:
      - path: docs/architecture/01_runtime_ownership.md
    evidence:
      - RuntimeRoot composes DocumentStoreKernel as the committed document owner.
    actual:
      compositionFields:
        - DocumentStoreKernel
  - id: runtime.root.owns_selection
    from: runtime.root
    to: selection.kernel
    kind: composes
    status: required
    sourceDocs:
      - path: docs/architecture/01_runtime_ownership.md
    evidence:
      - RuntimeRoot composes SelectionKernel behind the public selection port.
    actual:
      compositionFields:
        - SelectionKernel
  - id: runtime.root.composes_spatial_kernel
    from: runtime.root
    to: geometry.spatial_index
    kind: composes
    status: required
    sourceDocs:
      - path: docs/contracts/spatial_kernel.md
      - path: docs/architecture/01_runtime_ownership.md
    evidence:
      - RuntimeRoot composes SpatialKernel and applies spatial delivery before public runtime-state publication or commit-effect observer callbacks.
    actual:
      imports:
        - lib/src/geometry/spatial_kernel.dart
      compositionFields:
        - SpatialKernel
  - id: runtime.root.exposes_frame_facts
    from: runtime.root
    to: frame.renderer
    kind: frame_facts_provider
    status: required
    sourceDocs:
      - path: docs/contracts/frame_rendering.md
    evidence:
      - RuntimeRoot implements FrameFactsPort so FrameEngine and frame collaborators consume committed frame facts through the internal facts boundary instead of store internals.
    actual:
      implementedInterfaces:
        - FrameFactsPort
  - id: api.canvas_runtime.exposes_camera
    from: api.canvas_runtime
    to: api.camera_port
    kind: facade_port
    status: required
    sourceDocs:
      - path: docs/architecture/01_runtime_ownership.md
    evidence:
      - The camera public port is visible on the facade.
    actual:
      delegationTargets:
        - RuntimeRoot
      delegationMembers:
        - CanvasRuntime.camera
  - id: api.canvas_runtime.camera.routes_to_runtime_view_camera
    from: api.canvas_runtime
    to: runtime.view_camera
    kind: facade_port
    status: required
    sourceDocs:
      - path: docs/architecture/01_runtime_ownership.md
    evidence:
      - The public camera port must route to runtime-owned view camera state.
    actual:
      delegationTargets:
        - RuntimeRoot
      delegationMembers:
        - CanvasRuntime.camera
  - id: api.canvas_runtime.tools.routes_to_runtime_tools
    from: api.canvas_runtime
    to: runtime.root
    kind: facade_port
    status: required
    sourceDocs:
      - path: docs/contracts/public_api_v1.md
    evidence:
      - CanvasRuntime.tools is non-throwing in current for mode, draw style, pointer policy, pointer dispatch behavior, and cleanup; draw owns later draw production behavior behind the port.
    actual:
      delegationTargets:
        - RuntimeRoot
      delegationMembers:
        - CanvasRuntime.tools
  - id: api.canvas_runtime.commands.routes_to_runtime_commands
    from: api.canvas_runtime
    to: runtime.root
    kind: facade_port
    status: required
    sourceDocs:
      - path: docs/contracts/public_api_v1.md
    evidence:
      - CanvasRuntime.commands is non-throwing in current for remove, clear, and unknown text edit behavior routed through RuntimeRoot command adapters and EditKernel commits.
    actual:
      delegationTargets:
        - RuntimeRoot
      delegationMembers:
        - CanvasRuntime.commands
  - id: api.canvas_runtime.context_action_requests.routes_context_action_requests
    from: api.canvas_runtime
    to: runtime.root
    kind: facade_stream
    status: required
    sourceDocs:
      - path: docs/contracts/public_api_v1.md
    evidence:
      - CanvasRuntime.contextActionRequests is a non-throwing broadcast stream that is empty in current, emits eraser/context-action context-action requests from RuntimeRoot, and closes with RuntimeRoot disposal.
    actual:
      delegationTargets:
        - RuntimeRoot
      delegationMembers:
        - CanvasRuntime.contextActionRequests
  - id: codec.schema_v1.uses_public_contracts
    from: codec.schema_v1
    to: contracts.public
    kind: data_boundary
    status: required
    sourceDocs:
      - path: docs/contracts/schema_v1.md
      - path: docs/contracts/codec_boundary.md
    evidence:
      - Schema v1 codec reads and writes public contract DTOs without runtime side effects.
    actual:
      imports:
        - lib/src/contracts/public/canvas_document.dart
  - id: codec.schema_v1.failures.report_to_diagnostics
    from: codec.schema_v1
    to: diagnostics.hub
    kind: diagnostic_route
    status: required
    sourceDocs:
      - path: docs/contracts/diagnostics.md
    evidence:
      - Codec failure paths must route through an explicit graph-checkable diagnostics bridge, not only import DiagnosticsHub.
    actual:
      delegationMembers:
        - recordSchemaV1FailureDiagnostic
      delegationTargets:
        - DiagnosticsHub
      sensitiveThrowOwner: codec.schema_v1
      sensitiveThrowRoutes:
        - recordSchemaV1FailureDiagnostic
  - id: interaction.engine.reliability_events.report_to_diagnostics
    from: interaction.engine
    to: diagnostics.hub
    kind: diagnostic_route
    status: required
    sourceDocs:
      - path: docs/contracts/diagnostics.md
      - path: docs/contracts/interaction_engine.md
    evidence:
      - Interaction-observed hit-test fallback, query budget, stale candidate, stale terminal, invalid cleanup, selected-move denial, and resolver reentrancy reliability events route through an internal sink that runtime maps to DiagnosticsHub without public API exposure.
    actual:
      delegationMembers:
        - InteractionEngine._recordQueryDiagnostics
        - InteractionEngine._recordInvalidTerminalCleanup
        - InteractionEngine._recordStaleTerminalRejected
        - InteractionEngine._selectedMoveStartDecision
      delegationTargets:
        - InteractionDiagnosticsSink
  - id: edit.kernel.mutates_store
    from: edit.kernel
    to: store.document_kernel
    kind: mutation_boundary
    status: required
    sourceDocs:
      - path: docs/contracts/edit_kernel.md
    evidence:
      - Edit behavior commits through the runtime-composed CommitInstaller seam into the committed store owner and returns a post-install apply result.
    actual:
      delegationMembers:
        - EditKernel._installCommittedDocument
      delegationTargets:
        - CommitInstaller
  - id: load_document.pipeline.replaces_store_document
    from: load_document.pipeline
    to: store.document_kernel
    kind: mutation_boundary
    status: required
    sourceDocs:
      - path: docs/contracts/load_document.md
    evidence:
      - Load document admits validated replacement documents into runtime state through the pipeline-owned store boundary.
    actual:
      compositionFields:
        - DocumentStoreKernel
  - id: runtime.root.owns_resource_kernel
    from: runtime.root
    to: resource.kernel
    kind: composition
    status: required
    sourceDocs:
      - path: docs/architecture/01_runtime_ownership.md
      - path: docs/contracts/resources.md
    evidence:
      - RuntimeRoot composes and coordinates ResourceKernel for the public resource port, resource visual state publication, dirty-resource orchestration, and session invalidation events.
    actual:
      compositionFields:
        - ResourceKernel
  - id: runtime.root.invalidates_active_resource_session
    from: runtime.root
    to: resource.surface_session
    kind: resource_invalidation
    status: required
    sourceDocs:
      - path: docs/contracts/resources.md
    evidence:
      - RuntimeRoot holds the nullable active ResourceSessionInvalidationSink and forwards accepted ResourceDirtyOutcome target/all invalidation to the active SurfaceResourceSession before dirty publication, without ResourceKernel owning app image references or session cache entries.
    actual:
      compositionFields:
        - ResourceSessionInvalidationSink
  - id: runtime.root.finalizes_user_actions
    from: runtime.root
    to: api.canvas_runtime
    kind: action_stream_boundary
    status: required
    sourceDocs:
      - path: docs/contracts/operation_matrix.md
      - path: docs/contracts/public_api_v1.md
    evidence:
      - RuntimeRoot publishes accepted public state before RuntimeActionFinalizer resolves action ids, timestamps, payloads, and emits CanvasActionCommitted events on CanvasRuntime.actions.
    actual:
      compositionFields:
        - RuntimeActionFinalizer
  - id: runtime.root.provides_interaction_read_port
    from: runtime.root
    to: interaction.engine
    kind: read_port_adapter
    status: required
    sourceDocs:
      - path: docs/contracts/interaction_engine.md
      - path: docs/architecture/01_runtime_ownership.md
    evidence:
      - RuntimeRoot composes the runtime-local InteractionReadPort adapter so interaction receives immutable selected-move and marquee fact bundles instead of concrete store, selection, spatial, frame, resource, edit, or public stream owners.
    actual:
      compositionFields:
        - InteractionReadPort
  - id: frame.renderer.uses_surface_resource_session
    from: frame.renderer
    to: resource.surface_session
    kind: resource_boundary
    status: required
    sourceDocs:
      - path: docs/contracts/resources.md
      - path: docs/contracts/frame_rendering.md
    evidence:
      - PaintAssetBindingService binds image descriptors through SurfaceResourceSession after ordinary record planning; painters and ordinary planners do not own typed CanvasResourceResolver references.
    actual:
      delegationMembers:
        - PaintAssetBindingService.bind
      delegationTargets:
        - SurfaceResourceSession
  - id: draw.tools.commit_through_edit_kernel
    from: runtime.root
    to: edit.kernel
    kind: tool_commit
    status: required
    sourceDocs:
      - path: docs/contracts/operation_matrix.md
    evidence:
      - RuntimeRoot delivers accepted pencil, marker, and line terminal commit intents through EditKernel.prepareInteractionCommit and CanvasEdit.addElement.
    actual:
      delegationMembers:
        - RuntimeRoot._prepareDrawStrokeCommit
        - RuntimeRoot._prepareDrawLineCommit
      delegationTargets:
        - EditKernel
  - id: draw.tools.delegate_lifecycle_decisions
    from: interaction.engine
    to: draw.tools
    kind: tool_lifecycle_delegation
    status: required
    sourceDocs:
      - path: docs/contracts/interaction_engine.md
    evidence:
      - InteractionEngine delegates stroke and line lifecycle decisions to DrawStrokeMachine and LineMachine, then owns preview publication, pending line state, and cleanup routing.
    actual:
      delegationMembers:
        - InteractionEngine._handleDrawDown
        - InteractionEngine._handleDrawMove
        - InteractionEngine._handleDrawTerminal
        - InteractionEngine._handleLineDown
        - InteractionEngine._handleLineEndpointMove
        - InteractionEngine._handleLineEndpointTerminal
        - InteractionEngine._handleLineFirstTapTerminal
      delegationTargets:
        - DrawStrokeMachine
        - LineMachine
  - id: eraser_context.request.commit_through_edit_kernel
    from: runtime.root
    to: edit.kernel
    kind: tool_commit
    status: required
    sourceDocs:
      - path: docs/contracts/operation_matrix.md
    evidence:
      - RuntimeRoot delivers accepted eraser and request-originated text changes through EditKernel.prepareInteractionCommit before public state/action delivery.
    actual:
      delegationMembers:
        - RuntimeRoot._prepareEraserCommit
        - RuntimeRoot.commitTextEdit
      delegationTargets:
        - EditKernel
  - id: eraser_context.request.uses_target_geometry
    from: runtime.root
    to: geometry.spatial_index
    kind: interaction_target_geometry_boundary
    status: required
    sourceDocs:
      - path: docs/contracts/geometry.md
      - path: docs/contracts/spatial_kernel.md
    evidence:
      - RuntimeInteractionReadAdapter resolves eraser and context target facts through SpatialKernel query paths without exposing store tables to interaction machines.
    actual:
      delegationMembers:
        - RuntimeInteractionReadAdapter._eraserFacts
        - RuntimeInteractionReadAdapter._contextTargetFacts
      delegationTargets:
        - SpatialKernel
  - id: eraser_context.request.delegate_lifecycle_and_requests
    from: interaction.engine
    to: eraser_context.request
    kind: lifecycle_request_delegation
    status: required
    sourceDocs:
      - path: docs/contracts/interaction_engine.md
    evidence:
      - InteractionEngine delegates eraser/context-action eraser lifecycle and context request decisions to EraserMachine, ContextActionRouter, and InteractionRequestRegistry while owning preview/session state and cleanup routing.
    actual:
      delegationMembers:
        - InteractionEngine.handleDoubleTap
        - InteractionEngine._handleEraserDown
        - InteractionEngine._handleEraserMove
        - InteractionEngine._handleEraserTerminal
        - InteractionEngine._issueContextRequest
      delegationTargets:
        - EraserMachine
        - ContextActionRouter
        - InteractionRequestRegistry
  - id: eraser_context.request.produces_context_action_requests
    from: runtime.root
    to: api.canvas_runtime
    kind: context_request_stream
    status: required
    sourceDocs:
      - path: docs/contracts/interaction_engine.md
    evidence:
      - RuntimeRoot emits accepted eraser/context-action context-action requests through the public CanvasRuntime.contextActionRequests stream controller.
    actual:
      delegationMembers:
        - RuntimeRoot._emitContextRequest
      delegationTargets:
        - StreamController<CanvasContextActionRequested>
