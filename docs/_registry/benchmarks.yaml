manifest_version: "benchmark_measurement_boundary_v3"
tool_schema_version: 4
release_contour:
  runner_label: "ubuntu-24.04"
  os_name: "Ubuntu"
  os_version: "24.04"
  flutter_channel: "stable"
  flutter_version: "3.44.0"
profiles:
  - id: dry_run
    warmups: 0
    repetitions: 1
    iterations: 1
    timing_claims: false
    scale_selection: all_required_scales
  - id: smoke
    warmups: 1
    repetitions: 3
    minimum_measured_ms: 500
    minimum_samples: 100
    timing_claims: true
    scale_selection: smallest_required_scale_preserve_dense
  - id: release
    warmups: 1
    repetitions: 5
    minimum_measured_ms: 2000
    minimum_samples: 0
    timing_claims: true
    scale_selection: all_required_scales
post_baseline_regression_caps:
  avg_us_percent: 15
  avg_us_floor_us: 15000
  p95_us_percent: 15
  p95_us_floor_us: 30000
  max_us_percent: 30
  max_us_floor_us: 30000
  allocation_or_rss_percent: 10
  allocation_floor_bytes: 16777216
  rss_floor_bytes: 16777216
first_baseline_reference_limits:
  avg_us_multiplier: 1.35
budget_classes:
  - id: hot_input
    absolute_caps:
      avg_us_by_scale:
        "1k": 9000
        "10k": 8000
        "50k": 40000
        "100k": 40000
      p95_us_by_scale:
        "1k": 11000
        "10k": 15000
        "50k": 70000
        "100k": 50000
      max_us_by_scale:
        "1k": 32000
        "10k": 15000
        "50k": 70000
        "100k": 50000
  - id: incremental_edit
    absolute_caps:
      avg_us_by_scale:
        "1k": 1500
        "10k": 8000
        "50k": 40000
        "100k": 85000
      p95_us_by_scale:
        "1k": 4000
        "10k": 10000
        "50k": 50000
        "100k": 100000
      max_us_by_scale:
        "1k": 8000
        "10k": 15000
        "50k": 50000
        "100k": 100000
  - id: frame_capture
    absolute_caps:
      avg_us_by_scale:
        "1k": 6000
        "10k": 6000
        "50k": 40000
        "100k": 40000
      p95_us_by_scale:
        "1k": 10000
        "10k": 10000
        "50k": 60000
        "100k": 60000
      max_us_by_scale:
        "1k": 25000
        "10k": 25000
        "50k": 60000
        "100k": 60000
  - id: query_read
    absolute_caps:
      avg_us_by_scale:
        "1k": 6000
        "10k": 20000
        "50k": 110000
        "100k": 210000
      p95_us_by_scale:
        "1k": 8000
        "10k": 40000
        "50k": 140000
        "100k": 250000
      max_us_by_scale:
        "1k": 15000
        "10k": 35000
        "50k": 140000
        "100k": 250000
  - id: resource_budgeted
    absolute_caps:
      avg_us: 1000
      p95_us: 4000
      max_us: 8000
      cold_sync_resolver_calls: 128
  - id: bulk_io
    absolute_caps:
      p95_us_by_scale:
        "1k": 100000
        "10k": 500000
        "50k": 2250000
        "100k": 2000000
      failure_mutation_count: 0
  - id: exact_invariant
    absolute_caps:
      required_counts_match_manifest: true
      positive_drift_allowed: false
  - id: allocation_budget
    absolute_caps:
      zero_allocation_records: 0
      zero_allocation_bytes: 0
      zero_rss_delta_bytes: 0
memory_scopes:
  - id: zero_allocation
    allocation_bytes_cap: 0
    rss_delta_bytes_cap: 0
  - id: hot_or_query
    allocation_bytes_cap_by_scale:
      "1k": 2750000
      "10k": 1048576
      "50k": 22000000
      "100k": 1048576
    rss_delta_bytes_cap_by_scale:
      "1k": 2750000
      "10k": 1048576
      "50k": 22000000
      "100k": 1048576
