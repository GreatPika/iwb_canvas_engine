schema_version: 1
source_of_truth: docs/split/architecture/architecture.yaml
package:
  name: iwb_canvas_engine_next
  boundary: next/iwb_canvas_engine_next
  public_entrypoint: lib/iwb_canvas_engine_next.dart
external_actors:
  - id: Application
    label: Application
    summary: Owns domain state and calls the public canvas API.
  - id: Flutter
    label: Flutter framework
    summary: Supplies widget, input, image, and painting integrations.
  - id: JsonDocument
    label: Schema v1 JSON document
    summary: Persisted interchange input and output at the codec boundary.
runtime_owners:
  - id: PublicAPI
    label: Public API
    package_path: lib/src/api/
    summary: Stable DTOs, operations, events, and errors.
    source_refs:
      - docs/split/architecture/01_runtime_ownership.md
      - docs/split/architecture/02_package_boundaries.md
  - id: RuntimeRoot
    label: RuntimeRoot
    package_path: lib/src/runtime/
    summary: Composition root for document, edit, interaction, frame, spatial,
      resource, codec, and diagnostic services.
    source_refs:
      - docs/split/architecture/01_runtime_ownership.md
      - docs/split/architecture/02_package_boundaries.md
  - id: DocumentStoreKernel
    label: DocumentStoreKernel
    package_path: lib/src/store/
    summary: Committed document state, revisions, selection, and resources.
    source_refs:
      - docs/split/architecture/01_runtime_ownership.md
      - docs/split/architecture/02_package_boundaries.md
      - docs/split/architecture/03_data_model.md
  - id: EditKernel
    label: EditKernel
    package_path: lib/src/edit/
    summary: Synchronous edit sessions with draft, touched-set, commit, and
      rollback ownership.
    source_refs:
      - docs/split/architecture/01_runtime_ownership.md
      - docs/split/architecture/02_package_boundaries.md
  - id: InteractionEngine
    label: InteractionEngine
    package_path: lib/src/interaction/
    summary: Pointer sessions, tool state, previews, and terminal edit requests.
    source_refs:
      - docs/split/architecture/01_runtime_ownership.md
      - docs/split/architecture/02_package_boundaries.md
  - id: FrameEngine
    label: FrameEngine
    package_path: lib/src/frame/
    summary: Captured main and overlay frames, paint plans, and repaint buses.
    source_refs:
      - docs/split/architecture/01_runtime_ownership.md
      - docs/split/architecture/02_package_boundaries.md
  - id: SpatialKernel
    label: SpatialKernel
    package_path: lib/src/spatial/
    summary: Hit testing, bounds, and spatial indexes derived from document
      state.
    source_refs:
      - docs/split/architecture/01_runtime_ownership.md
      - docs/split/architecture/02_package_boundaries.md
  - id: ResourceKernel
    label: ResourceKernel
    package_path: lib/src/resources/
    summary: Resource descriptors, resolver cache, and invalidation.
    source_refs:
      - docs/split/architecture/01_runtime_ownership.md
      - docs/split/architecture/02_package_boundaries.md
  - id: CodecBoundary
    label: CodecBoundary
    package_path: lib/src/codec/
    summary: Schema v1 JSON decode, encode, migration, and diagnostics.
    source_refs:
      - docs/split/architecture/01_runtime_ownership.md
      - docs/split/architecture/02_package_boundaries.md
  - id: DiagnosticsHub
    label: DiagnosticsHub
    package_path: lib/src/diagnostics/
    summary: Structured validation, runtime, and migration error projection.
    source_refs:
      - docs/split/architecture/01_runtime_ownership.md
      - docs/split/architecture/02_package_boundaries.md
package_boundaries:
  - id: no_legacy_imports
    rule: The next package must not import legacy package or legacy source.
  - id: public_api_hides_runtime
    rule: Public exports must not expose runtime internals, stores, caches, or
      Flutter widget implementation details.
  - id: committed_edits_use_edit_kernel
    rule: Committed document mutations flow through EditKernel.
allowed_dependencies:
  - from: Application
    to: PublicAPI
  - from: PublicAPI
    to: RuntimeRoot
  - from: RuntimeRoot
    to: DocumentStoreKernel
  - from: RuntimeRoot
    to: EditKernel
  - from: RuntimeRoot
    to: InteractionEngine
  - from: RuntimeRoot
    to: FrameEngine
  - from: RuntimeRoot
    to: SpatialKernel
  - from: RuntimeRoot
    to: ResourceKernel
  - from: RuntimeRoot
    to: CodecBoundary
  - from: RuntimeRoot
    to: DiagnosticsHub
  - from: EditKernel
    to: DocumentStoreKernel
  - from: EditKernel
    to: DiagnosticsHub
  - from: InteractionEngine
    to: EditKernel
  - from: InteractionEngine
    to: SpatialKernel
  - from: FrameEngine
    to: DocumentStoreKernel
  - from: FrameEngine
    to: SpatialKernel
  - from: FrameEngine
    to: ResourceKernel
  - from: SpatialKernel
    to: DocumentStoreKernel
  - from: CodecBoundary
    to: DocumentStoreKernel
  - from: CodecBoundary
    to: DiagnosticsHub
  - from: Flutter
    to: PublicAPI
  - from: JsonDocument
    to: PublicAPI
forbidden_dependencies:
  - from: PublicAPI
    to: DocumentStoreKernel
    reason: Public API must not expose runtime storage internals.
  - from: InteractionEngine
    to: DocumentStoreKernel
    reason: Pointer handling must request committed changes through EditKernel.
  - from: FrameEngine
    to: EditKernel
    reason: Rendering is read-only against committed or preview state.
  - from: RuntimeRoot
    to: legacy/iwb_canvas_engine
    reason: The next package must not depend on legacy implementation.
diagram_targets:
  - id: c4_context
    kind: c4_context
    planned_path: docs/split/diagrams/generated/c4_context.mmd
  - id: c4_container
    kind: c4_container
    planned_path: docs/split/diagrams/generated/c4_container.mmd
  - id: c4_component_runtime
    kind: c4_component
    planned_path: docs/split/diagrams/generated/c4_component_runtime.mmd
